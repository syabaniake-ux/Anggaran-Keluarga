<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Anggaran Bulanan Keluarga</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12403F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anggaran Keluarga">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2312403F'/%3E%3Ctext x='50' y='64' font-family='Arial,sans-serif' font-size='42' font-weight='700' fill='%23D9A441' text-anchor='middle'%3ERp%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2312403F'/%3E%3Ctext x='50' y='64' font-family='Arial,sans-serif' font-size='42' font-weight='700' fill='%23D9A441' text-anchor='middle'%3ERp%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Anggaran%20Bulanan%20Keluarga%22%2C%22short_name%22%3A%22Anggaran%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ECEFE9%22%2C%22theme_color%22%3A%22%2312403F%22%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12403F;
  --ink-soft:#2E5654;
  --paper:#ECEFE9;
  --paper-card:#F7F8F4;
  --line:#D3D8CC;
  --gold:#D9A441;
  --gold-deep:#B8842B;
  --good:#3F7C6E;
  --bad:#B24C3C;
  --text:#1C2B29;
  --text-mute:#5C6D68;
  --radius:14px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 80px;}

/* HEADER */
.hero{
  background:var(--ink);
  color:#fff;
  padding:22px 16px 0;
  border-radius:0 0 20px 20px;
  margin-bottom:18px;
}
.hero-inner{max-width:1080px;margin:0 auto;}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:8px;background:var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:15px;
}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.2px;}
.brand-sub{font-size:11px;color:#AEC8C4;margin-top:1px;}

.month-controls{display:flex;align-items:center;gap:8px;}
.backup-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;}
.storage-badge{font-size:11px;color:#AEC8C4;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:5px 10px;}
select.month-select{
  background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.25);
  border-radius:9px;padding:8px 10px;font-family:var(--font-mono);font-size:13px;
}
select.month-select option{color:#111;}
button{font-family:var(--font-body);cursor:pointer;}
.btn{
  border:none;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;
}
.btn-gold{background:var(--gold);color:var(--ink);}
.btn-gold:hover{background:var(--gold-deep);}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);}
.btn-ghost:hover{background:rgba(255,255,255,.16);}
.btn-danger-ghost{background:rgba(178,76,60,.12);color:#F3B3A6;border:1px solid rgba(178,76,60,.3);}

/* TABS */
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:18px;padding-bottom:0;-ms-overflow-style:none;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  background:transparent;border:none;color:#AEC8C4;padding:10px 14px;font-size:13px;font-weight:600;
  white-space:nowrap;border-radius:10px 10px 0 0;position:relative;top:1px;font-family:var(--font-body);
}
.tab-btn.active{background:var(--paper);color:var(--ink);}

/* CARDS */
.card{
  background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:16px;
}
.card h2{
  font-family:var(--font-display);font-size:16px;margin:0 0 4px;color:var(--ink);
}
.card .hint{font-size:12px;color:var(--text-mute);margin:0 0 14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}

.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;color:var(--text-mute);font-weight:600;}
.field input{
  font-family:var(--font-mono);font-size:14px;padding:9px 10px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--text);width:100%;
}
.field input:focus{outline:2px solid var(--gold);outline-offset:1px;}

/* ENVELOPES (signature element) */
.envelopes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px;}
@media(max-width:720px){.envelopes{grid-template-columns:1fr;}}
.envelope{
  position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:16px 14px 14px;overflow:hidden;
}
.envelope::before{
  content:"";position:absolute;top:0;left:0;right:0;height:46px;
  background:linear-gradient(135deg, var(--env-color,var(--ink)) 50%, transparent 50.5%),
             linear-gradient(-135deg, var(--env-color,var(--ink)) 50%, transparent 50.5%);
  background-position:left top,right top;background-size:50% 100%;background-repeat:no-repeat;
  opacity:.14;
}
.env-label{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--ink);position:relative;}
.env-pct{font-size:11px;color:var(--text-mute);margin-bottom:10px;position:relative;}
.env-bar{height:9px;border-radius:6px;background:var(--paper);overflow:hidden;margin:8px 0;}
.env-fill{height:100%;border-radius:6px;background:var(--env-color,var(--ink));transition:width .3s;}
.env-nums{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;margin-top:4px;}
.env-nums .label{color:var(--text-mute);}
.env-over{color:var(--bad)!important;font-weight:600;}

/* SUMMARY STAT ROW */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:720px){.stat-row{grid-template-columns:repeat(2,1fr);}}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.stat .label{font-size:11px;color:var(--text-mute);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.stat .value{font-family:var(--font-mono);font-size:17px;font-weight:600;margin-top:4px;color:var(--ink);}
.stat .value.bad{color:var(--bad);}
.stat .value.good{color:var(--good);}

/* TABLES */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--text-mute);
  padding:6px 8px;border-bottom:2px solid var(--line);font-weight:600;
}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
td input{
  font-family:var(--font-mono);font-size:13px;padding:6px 7px;border-radius:6px;
  border:1px solid transparent;background:transparent;width:100%;color:var(--text);
}
td input:hover{border-color:var(--line);}
td input:focus{outline:none;border-color:var(--gold);background:#fff;}
td input[type=text]{font-family:var(--font-body);}
.num{text-align:right;font-family:var(--font-mono);}
.num input{text-align:right;}
tr.subtotal td{font-weight:700;background:rgba(217,164,65,.08);font-family:var(--font-mono);}
tr.subtotal td:first-child{font-family:var(--font-display);}
.selisih-neg{color:var(--bad);}
.selisih-pos{color:var(--good);}
.row-del{
  background:none;border:none;color:var(--text-mute);font-size:15px;padding:2px 6px;border-radius:6px;
}
.row-del:hover{color:var(--bad);background:rgba(178,76,60,.08);}
.subcat-block{margin-bottom:18px;}
.subcat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.subcat-head input.subcat-name{
  font-family:var(--font-display);font-weight:600;font-size:14px;border:none;background:transparent;
  padding:2px 4px;border-radius:6px;color:var(--ink);
}
.subcat-head input.subcat-name:hover,.subcat-head input.subcat-name:focus{background:#fff;border:1px solid var(--line);outline:none;}
.add-row-btn{
  font-size:12px;font-weight:600;color:var(--ink-soft);background:none;border:1px dashed var(--line);
  border-radius:7px;padding:5px 10px;margin-top:4px;
}
.add-row-btn:hover{border-color:var(--gold);color:var(--gold-deep);}
.section-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.btn-outline{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:600;color:var(--ink-soft);}
.btn-outline:hover{border-color:var(--gold);color:var(--gold-deep);}

.group-total-banner{
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;background:var(--ink);color:#fff;
  border-radius:10px;padding:12px 16px;margin-bottom:16px;font-family:var(--font-mono);font-size:13px;
}
.group-total-banner b{font-family:var(--font-display);font-size:13px;}
.group-total-banner .gt-item .l{color:#AEC8C4;font-size:11px;display:block;margin-bottom:2px;font-family:var(--font-body);}

footer.note{font-size:12px;color:var(--text-mute);text-align:center;margin-top:24px;}
.empty-hint{font-size:12px;color:var(--text-mute);padding:10px 0;}
.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;
}
.toast.show{opacity:1;}

.num-input-wrap{display:flex;align-items:center;gap:2px;}
.num-input-wrap input{flex:1;min-width:0;}
.calc-trigger{border:none;background:transparent;cursor:pointer;font-size:13px;line-height:1;padding:4px 5px;border-radius:6px;color:var(--text-mute);flex-shrink:0;}
.calc-trigger:hover{background:var(--paper);color:var(--ink);}
.calc-popover{
  position:absolute;display:none;z-index:200;background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px;width:184px;
}
.calc-display{
  font-family:var(--font-mono);font-size:16px;text-align:right;background:var(--paper);border-radius:6px;
  padding:8px 10px;margin-bottom:8px;overflow-x:auto;white-space:nowrap;color:var(--text);
}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.calc-grid button{
  font-family:var(--font-mono);font-size:14px;padding:8px 0;border:1px solid var(--line);background:var(--paper-card);
  border-radius:6px;cursor:pointer;color:var(--text);
}
.calc-grid button:hover{background:var(--paper);}
.calc-grid button.op{color:var(--gold-deep);font-weight:600;}
.calc-grid button.eq{background:var(--gold);color:var(--ink);font-weight:700;}
.sumber-select{
  font-family:var(--font-body);font-size:12px;padding:6px 7px;border-radius:6px;border:1px solid var(--line);
  background:#fff;color:var(--text);width:100%;max-width:150px;
}
.alokasi-select{
  font-family:var(--font-body);font-size:12px;padding:6px 7px;border-radius:6px;border:1px solid var(--line);
  background:#fff;color:var(--text);width:100%;max-width:170px;
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================= STORAGE HELPERS ============================= */
/* Uses Claude's artifact storage when available; otherwise falls back to this
   browser's localStorage so the app also works standalone (saved/opened
   directly on a phone or laptop). localStorage is per-device only, hence the
   Ekspor/Impor feature to move data between devices. */
const hasCloudStorage = (typeof window.storage !== 'undefined');
const LS_PREFIX = 'anggaranKeluarga:';

async function storeGet(key){
  if(hasCloudStorage){
    try{ const r = await window.storage.get(key,false); return r? JSON.parse(r.value): null; }
    catch(e){ return null; }
  }
  try{ const v = localStorage.getItem(LS_PREFIX+key); return v? JSON.parse(v): null; }
  catch(e){ return null; }
}
async function storeSet(key,val){
  if(hasCloudStorage){
    const json = JSON.stringify(val);
    try{ return await window.storage.set(key, json, false); }
    catch(e){ console.error('storage set failed', e, 'payload size (bytes):', json.length); return null; }
  }
  try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(val)); return {key,value:val}; }
  catch(e){ console.error('storage set failed',e); return null; }
}
async function storeListKeys(prefix){
  if(hasCloudStorage){
    try{ const r = await window.storage.list(prefix,false); return r? r.keys: []; }
    catch(e){ return []; }
  }
  const keys = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith(LS_PREFIX+prefix)) keys.push(k.slice(LS_PREFIX.length));
  }
  return keys;
}
async function storeDelete(key){
  if(hasCloudStorage){
    try{ await window.storage.delete(key,false); }catch(e){}
    return;
  }
  try{ localStorage.removeItem(LS_PREFIX+key); }catch(e){}
}

/* ============================= DATA MODEL ============================= */
const MONTHS_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function uid(){ return Math.random().toString(36).slice(2,9); }

function item(name, prakiraan=0, aktual=0, sumber=''){ return { id:uid(), name, prakiraan, aktual, sumber }; }
function subcat(name, items){ return { id:uid(), name, items }; }

function defaultGroups(){
  return {
    needs: {
      label:'Kebutuhan Pokok & Kewajiban', pct:0.6, color:'#3F7C6E',
      subcats:[
        subcat('Orang Tua',[item('Margahayu'),item('Bakung'),item('Lainnya')]),
        subcat('Keluarga',[item('SPP Akhtar'),item('Bekal Akhtar'),item('Ekstrakulikuler'),item('Ummi'),item('Akhtar'),item('Lainnya')]),
        subcat('Sembako & Kebutuhan RT',[item('Bahan Makanan'),item('Makanan Siap Saji'),item('Kebutuhan RT'),item('Lainnya')]),
        subcat('Rumah',[item('Listrik'),item('Air'),item('Telepon'),item('Margahayu'),item('Riung Jembar')]),
        subcat('Internet & Pulsa',[item('Internet Rumah'),item('Internet Abi Telkomsel'),item('Internet Abi Indosat'),item('Internet Ummi'),item('Internet Akhtar'),item('Lainnya')]),
        subcat('Perawatan Pribadi',[item('Dokter'),item('Obat'),item('Laboratorium'),item('BPJS'),item('Cadangan darurat'),item('Lainnya')]),
        subcat('Transportasi',[item('Online'),item('Parkir'),item('Pajak'),item('Surat-surat'),item('Bahan bakar'),item('Pemeliharaan'),item('Lainnya')]),
      ]
    },
    wants: {
      label:'Sekunder & Fleksibel', pct:0.2, color:'#D9A441',
      subcats:[
        subcat('Sekunder & Fleksibel',[
          item('Jalan-jalan keluarga'),item('Jajan'),item('Langganan streaming'),item('Gadget'),
          item('Olahraga'),item('Fashion'),item('Hobi (otomotif/sepeda)'),
          item('Kartu Kredit Jenius (entertainment)'),item('Rokok')
        ]),
      ]
    },
    savings:{
      label:'Pelunasan Pinjaman & Tabungan', pct:0.2, color:'#12403F',
      subcats:[
        subcat('Pinjaman',[item('Tanah Riung Bandung'),item('Pribadi'),item('Dana darurat'),item('Kartu kredit'),item('Lainnya')]),
        subcat('Tabungan atau Investasi',[item('Cash'),item('Rekening jenius'),item('Arisan'),item('Lainnya')]),
        subcat('Hadiah & Donasi',[item('Baitul Maal'),item('Sodaqoh, Infaq, Fidyah'),item('Administrasi Bank'),item('Lainnya')]),
        subcat('Bisnis',[item('Investasi 1'),item('Investasi 2'),item('Investasi 3'),item('Lainnya')]),
      ]
    }
  };
}

/* migrate older saved month data to the current schema */
function migrateData(d){
  if(!d) return d;
  delete d.tambahan; // "Tambahan Dana" removed — use Transfer Antar Rekening (incl. Tabungan) instead
  d.groups = d.groups || {};
  if(d.groups.savings){
    if(d.groups.hadiah){
      d.groups.savings.subcats.push(...d.groups.hadiah.subcats);
      delete d.groups.hadiah;
    }
    if(d.groups.bisnis){
      d.groups.savings.subcats.push(...d.groups.bisnis.subcats);
      delete d.groups.bisnis;
    }
  }
  d.saldo = d.saldo || {};
  if(!Array.isArray(d.saldoAccounts)){
    d.saldoAccounts = [
      {id:uid(), nama:'Mandiri Private', saldo:Number(d.saldo.mandiriPrivate)||0},
      {id:uid(), nama:'Mandiri Office', saldo:Number(d.saldo.mandiriOffice)||0},
      {id:uid(), nama:'Cash', saldo:Number(d.saldo.cash)||0},
      {id:uid(), nama:'Debit', saldo:Number(d.saldo.debit)||0},
      {id:uid(), nama:'Aset Lainnya', saldo:Number(d.saldo.asetLain)||0},
    ];
  }
  if(!Array.isArray(d.ewallets)){
    d.ewallets = [];
    if(d.saldo.wallet){
      d.ewallets.push({id:uid(), nama:'Wallet/E-money', saldo:Number(d.saldo.wallet)||0});
    }
    ['Gopay','OVO','Spay','Dana','Emoney'].forEach(nm=>{
      if(!d.ewallets.find(w=>w.nama===nm)) d.ewallets.push({id:uid(), nama:nm, saldo:0});
    });
  }
  delete d.saldo.wallet;
  delete d.saldo.mandiriPrivate; delete d.saldo.mandiriOffice; delete d.saldo.cash; delete d.saldo.debit; delete d.saldo.asetLain;
  d.saldoAccounts.forEach(a=>{ if(typeof a.alokasi !== 'string') a.alokasi = ''; });
  d.ewallets.forEach(w=>{ if(typeof w.alokasi !== 'string') w.alokasi = ''; });
  Object.values(d.groups).forEach(g=> (g.subcats||[]).forEach(sc=> (sc.items||[]).forEach(it=>{
    if(Array.isArray(it.transaksi)){
      // revert from the multi-transaction format back to a single aktual+sumber
      const total = it.transaksi.reduce((s,t)=>s+(Number(t.jumlah)||0),0);
      const lastWithSumber = [...it.transaksi].reverse().find(t=>t.sumber);
      it.aktual = total;
      it.sumber = lastWithSumber ? lastWithSumber.sumber : (it.sumber||'');
      delete it.transaksi;
    }
    if(typeof it.sumber !== 'string') it.sumber = '';
    if(typeof it.aktual !== 'number') it.aktual = Number(it.aktual)||0;
  })));
  return d;
}

function defaultMonthData(monthKey, carryOver){
  return {
    key: monthKey,
    income:{ abi:0, sisaBulanLalu: carryOver||0, lainnya:0 },
    saldoAccounts: [
      { id:uid(), nama:'Mandiri Private', saldo:0, alokasi:'' },
      { id:uid(), nama:'Mandiri Office', saldo:0, alokasi:'' },
      { id:uid(), nama:'Cash', saldo:0, alokasi:'' },
      { id:uid(), nama:'Debit', saldo:0, alokasi:'' },
      { id:uid(), nama:'Aset Lainnya', saldo:0, alokasi:'' },
    ],
    ewallets: [
      { id:uid(), nama:'Gopay', saldo:0, alokasi:'' },
      { id:uid(), nama:'OVO', saldo:0, alokasi:'' },
      { id:uid(), nama:'Spay', saldo:0, alokasi:'' },
      { id:uid(), nama:'Dana', saldo:0, alokasi:'' },
      { id:uid(), nama:'Emoney', saldo:0, alokasi:'' },
    ],
    groups: defaultGroups(),
    kartuKredit: [
      { id:uid(), nama:'', totalHarga:0, tenor:1, sisaBulan:0 }
    ],
    piutang: [ { id:uid(), nama:'', total:0, dibayar:0 } ],
    utang: [ { id:uid(), nama:'', total:0, dibayar:0 } ],
    tabungan: [ { id:uid(), rekening:'', total:0, debitKredit:0 } ],
  };
}

/* ============================= APP STATE ============================= */
let state = {
  monthKeys: [],
  currentKey: null,
  data: null,
  tab: 'ringkasan',
  loaded: false,
  cache: {}, // in-memory cache of month data already loaded/created this session, keyed by monthKey
};

function fmtMonthLabel(key){
  const [y,m] = key.split('-');
  return MONTHS_ID[parseInt(m,10)-1] + ' ' + y;
}
function currentMonthKeyDefault(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function nextMonthKey(key){
  let [y,m] = key.split('-').map(Number);
  m += 1; if(m>12){ m=1; y+=1; }
  return y+'-'+String(m).padStart(2,'0');
}

function fmtIDR(n){
  n = Math.round(n||0);
  const neg = n<0; n = Math.abs(n);
  let s = n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (neg?'-':'')+'Rp '+s;
}

/* ============================= COMPUTATION ============================= */
function computeSubcat(sc){
  let p=0,a=0;
  sc.items.forEach(it=>{ p+=Number(it.prakiraan)||0; a+=Number(it.aktual)||0; });
  return { prakiraan:p, aktual:a, selisih:p-a };
}
function computeGroup(g){
  let p=0,a=0;
  g.subcats.forEach(sc=>{ const c = computeSubcat(sc); p+=c.prakiraan; a+=c.aktual; });
  return { prakiraan:p, aktual:a, selisih:p-a };
}
function computeAll(d){
  const totalPendapatan = (Number(d.income.abi)||0)+(Number(d.income.sisaBulanLalu)||0)+(Number(d.income.lainnya)||0);
  const totalAlokasi = totalPendapatan;
  const g = {};
  Object.keys(d.groups).forEach(k=> g[k]=computeGroup(d.groups[k]));
  const totalPrakiraanBiaya = Object.values(g).reduce((s,x)=>s+x.prakiraan,0);
  const totalAktualBiaya = Object.values(g).reduce((s,x)=>s+x.aktual,0);
  const prakiraanSaldo = totalAlokasi - totalPrakiraanBiaya;
  const selisihAkhir = totalAlokasi - totalAktualBiaya;
  const totalRekening = (d.saldoAccounts||[]).reduce((s,a)=>s+(Number(a.saldo)||0),0);
  const totalEwallet = (d.ewallets||[]).reduce((s,w)=>s+(Number(w.saldo)||0),0);
  const totalAset = totalRekening + totalEwallet;
  // kartu kredit
  let kkTagihan=0;
  d.kartuKredit.forEach(k=>{
    const cicilan = (Number(k.tenor)||0)>0 ? (Number(k.totalHarga)||0)/Number(k.tenor) : 0;
    if((Number(k.sisaBulan)||0) > 0) kkTagihan += cicilan;
  });
  const piutangTotal = d.piutang.reduce((s,x)=>s+(Number(x.total)||0),0);
  const piutangDibayar = d.piutang.reduce((s,x)=>s+(Number(x.dibayar)||0),0);
  const utangTotal = d.utang.reduce((s,x)=>s+(Number(x.total)||0),0);
  const utangDibayar = d.utang.reduce((s,x)=>s+(Number(x.dibayar)||0),0);
  const tabunganTotal = d.tabungan.reduce((s,x)=>s+(Number(x.total)||0)+(Number(x.debitKredit)||0),0);
  return {
    totalPendapatan,totalAlokasi,g,totalPrakiraanBiaya,totalAktualBiaya,
    prakiraanSaldo,selisihAkhir,totalRekening,totalEwallet,totalAset,kkTagihan,
    piutangTotal,piutangDibayar,piutangSisa:piutangTotal-piutangDibayar,
    utangTotal,utangDibayar,utangSisa:utangTotal-utangDibayar,
    tabunganTotal
  };
}

/* ============================= SHARED ACCOUNT HELPERS ============================= */
/* A unified view of every account the user can hold money in: saldo rekening,
   e-wallets, and tabungan. Used by the Ringkasan tab (transfer/topup) and by
   the "Sumber Rekening" tag on actual expense items. */
function accountsList(d){
  const rek = (d.saldoAccounts||[]).map(a=>({id:'rek:'+a.id, label:a.nama||'(rekening tanpa nama)'}));
  const ew = (d.ewallets||[]).map(w=>({id:'ew:'+w.id, label:w.nama||'(wallet tanpa nama)'}));
  const tab = (d.tabungan||[]).map(t=>({id:'tab:'+t.id, label:(t.rekening||'(tabungan tanpa nama)')+' (Tabungan)'}));
  return [...rek, ...ew, ...tab];
}
function accountBalanceRaw(d, accId){
  if(!accId) return 0;
  if(accId.startsWith('ew:')){ const w=(d.ewallets||[]).find(x=>'ew:'+x.id===accId); return w? Number(w.saldo)||0 : 0; }
  if(accId.startsWith('rek:')){ const a=(d.saldoAccounts||[]).find(x=>'rek:'+x.id===accId); return a? Number(a.saldo)||0 : 0; }
  if(accId.startsWith('tab:')){ const t=(d.tabungan||[]).find(x=>'tab:'+x.id===accId); return t? (Number(t.total)||0)+(Number(t.debitKredit)||0) : 0; }
  return 0;
}
function setAccountBalanceRaw(d, accId, val){
  if(accId.startsWith('ew:')){ const w=(d.ewallets||[]).find(x=>'ew:'+x.id===accId); if(w) w.saldo = val; }
  else if(accId.startsWith('rek:')){ const a=(d.saldoAccounts||[]).find(x=>'rek:'+x.id===accId); if(a) a.saldo = val; }
  else if(accId.startsWith('tab:')){ const t=(d.tabungan||[]).find(x=>'tab:'+x.id===accId); if(t) t.debitKredit = val - (Number(t.total)||0); }
}
/* Sum of every actual expense tagged to this account, across all expense groups. */
function sumTaggedAktual(d, accId){
  let s = 0;
  Object.values(d.groups||{}).forEach(g=> (g.subcats||[]).forEach(sc=> (sc.items||[]).forEach(it=>{
    if(it.sumber && it.sumber===accId) s += Number(it.aktual)||0;
  })));
  return s;
}
/* Balance after subtracting whatever's already been tagged as spent from this account this month. */
function accountEffectiveBalance(d, accId){
  return accountBalanceRaw(d, accId) - sumTaggedAktual(d, accId);
}
function accountOptionsHtml(d, selectedId){
  let html = `<option value="">— Tidak dari rekening —</option>`;
  accountsList(d).forEach(a=>{
    html += `<option value="${a.id}" ${a.id===selectedId?'selected':''}>${escapeHtml(a.label)}</option>`;
  });
  return html;
}

/* Which budget envelope (needs/wants/savings) a saldo rekening / e-wallet account is earmarked for. */
const ALOKASI_LABELS = { needs:'Kebutuhan Pokok', wants:'Sekunder & Fleksibel', savings:'Pinjaman & Tabungan' };
function alokasiOptionsHtml(selected){
  let html = `<option value="" ${!selected?'selected':''}>— Belum ditentukan —</option>`;
  Object.keys(ALOKASI_LABELS).forEach(k=>{
    html += `<option value="${k}" ${k===selected?'selected':''}>${ALOKASI_LABELS[k]}</option>`;
  });
  return html;
}
/* For each envelope: how much budget should still be left (prakiraan-aktual) vs
   how much money is actually sitting in accounts earmarked for it, and the gap
   between the two (ideally 0 — meaning your money matches your plan). */
function computeAlokasiCheck(d){
  const c = computeAll(d);
  const out = {};
  Object.keys(ALOKASI_LABELS).forEach(k=>{
    const sisaAnggaran = c.g[k].prakiraan - c.g[k].aktual;
    const totalSaldo =
      (d.saldoAccounts||[]).filter(a=>a.alokasi===k).reduce((s,a)=>s+(Number(a.saldo)||0),0) +
      (d.ewallets||[]).filter(w=>w.alokasi===k).reduce((s,w)=>s+(Number(w.saldo)||0),0);
    out[k] = { sisaAnggaran, totalSaldo, selisih: sisaAnggaran - totalSaldo };
  });
  const unallocated =
    (d.saldoAccounts||[]).filter(a=>!a.alokasi).reduce((s,a)=>s+(Number(a.saldo)||0),0) +
    (d.ewallets||[]).filter(w=>!w.alokasi).reduce((s,w)=>s+(Number(w.saldo)||0),0);
  out.unallocated = unallocated;
  return out;
}

/* ============================= CALCULATOR POPOVER ============================= */
/* Small shared calculator used next to Prakiraan/Aktual fields. Opens near the
   trigger button, evaluates a simple arithmetic expression, and writes the
   result back into whichever input triggered it. */
let calcTarget = null;
let calcExpr = '';
function ensureCalcPopover(){
  let pop = document.getElementById('calc-popover');
  if(pop) return pop;
  pop = document.createElement('div');
  pop.id = 'calc-popover';
  pop.className = 'calc-popover';
  pop.innerHTML = `
    <div class="calc-display" id="calc-display">0</div>
    <div class="calc-grid">
      <button type="button" data-k="C">C</button><button type="button" data-k="(">(</button><button type="button" data-k=")">)</button><button type="button" class="op" data-k="/">÷</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button><button type="button" class="op" data-k="*">×</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button><button type="button" class="op" data-k="-">−</button>
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button><button type="button" class="op" data-k="+">+</button>
      <button type="button" data-k="0" style="grid-column:span 2;">0</button><button type="button" data-k=".">.</button><button type="button" class="eq" data-k="=">=</button>
    </div>`;
  document.body.appendChild(pop);
  pop.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-k]');
    if(!btn) return;
    const k = btn.getAttribute('data-k');
    if(k==='C'){
      calcExpr='';
    } else if(k==='='){
      if(/^[\d+\-*/().\s]+$/.test(calcExpr) && calcExpr.trim()){
        try{
          const result = Function('"use strict"; return ('+calcExpr+')')();
          if(typeof result==='number' && isFinite(result)){
            if(calcTarget){
              calcTarget.value = Math.round(result);
              calcTarget.dispatchEvent(new Event('input', {bubbles:true}));
            }
            closeCalculator();
            return;
          }
        }catch(err){ /* invalid expression, ignore */ }
      }
    } else {
      calcExpr += k;
    }
    document.getElementById('calc-display').textContent = calcExpr || '0';
  });
  document.addEventListener('click', (e)=>{
    if(pop.style.display!=='block') return;
    if(!pop.contains(e.target) && !e.target.closest('.calc-trigger')) closeCalculator();
  }, true);
  document.addEventListener('keydown', (e)=>{
    if(pop.style.display!=='block') return;
    if(e.key==='Escape') closeCalculator();
  });
  return pop;
}
function openCalculator(triggerBtn, inputEl){
  const pop = ensureCalcPopover();
  calcTarget = inputEl;
  calcExpr = inputEl.value ? String(inputEl.value) : '';
  document.getElementById('calc-display').textContent = calcExpr || '0';
  pop.style.display = 'block';
  const rect = triggerBtn.getBoundingClientRect();
  const popWidth = 190;
  let left = window.scrollX + rect.left;
  const maxLeft = window.scrollX + document.documentElement.clientWidth - popWidth - 8;
  if(left>maxLeft) left = Math.max(8,maxLeft);
  pop.style.top = (window.scrollY + rect.bottom + 4) + 'px';
  pop.style.left = left + 'px';
}
function closeCalculator(){
  const pop = document.getElementById('calc-popover');
  if(pop) pop.style.display = 'none';
  calcTarget = null;
}

/* ============================= PERSISTENCE ============================= */
async function persistCurrent(){
  if(!state.currentKey||!state.data) return true;
  clearTimeout(saveTimer); // an explicit save makes any pending debounced save redundant
  state.cache[state.currentKey] = state.data;
  const r1 = await storeSet('month:'+state.currentKey, state.data);
  const r2 = await storeSet('months:list', state.monthKeys);
  return !!(r1 && r2);
}
let saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    let ok = await persistCurrent();
    if(!ok) ok = await persistCurrent(); // one retry — often just a transient hiccup
    showToast(ok ? 'Tersimpan' : 'Gagal menyimpan, coba lagi');
  }, 500);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'),1200);
}

/* Load a month's data, preferring the in-memory cache. Only hits storage the
   first time a month is opened in this session, so switching/deleting months
   never risks a stale or failed read silently wiping out data that's already
   sitting correctly in memory. */
async function loadMonth(key){
  if(state.cache[key]) return state.cache[key];
  let d = await storeGet('month:'+key);
  if(!d) d = defaultMonthData(key,0);
  d = migrateData(d);
  state.cache[key] = d;
  return d;
}

async function init(){
  let keys = await storeListKeys('month:');
  let monthKeys = (await storeGet('months:list')) || [];
  if(!monthKeys.length){
    // derive from keys prefix if list missing
    monthKeys = keys.map(k=>k.replace('month:','')).sort();
  }
  if(!monthKeys.length){
    const k = currentMonthKeyDefault();
    monthKeys = [k];
    const d = defaultMonthData(k,0);
    await storeSet('month:'+k, d);
    await storeSet('months:list', monthKeys);
  }
  monthKeys.sort();
  state.monthKeys = monthKeys;
  state.currentKey = monthKeys[monthKeys.length-1];
  state.data = await loadMonth(state.currentKey);
  state.loaded = true;
  render();
}

async function switchMonth(key){
  await persistCurrent();
  state.currentKey = key;
  state.data = await loadMonth(key);
  render();
}

async function addNewMonth(){
  await persistCurrent();
  const lastKey = state.monthKeys[state.monthKeys.length-1];
  const newKey = nextMonthKey(lastKey);
  if(state.monthKeys.includes(newKey)){ await switchMonth(newKey); return; }
  const calc = computeAll(state.data);
  // carry over leftover balance as "sisa bulan kemarin", keep category names+prakiraan, reset aktual to 0
  const newData = JSON.parse(JSON.stringify(state.data));
  newData.income.sisaBulanLalu = Math.round(calc.selisihAkhir);
  newData.income.abi = 0; newData.income.lainnya = 0;
  Object.values(newData.groups).forEach(g=> g.subcats.forEach(sc=> sc.items.forEach(it=> it.aktual = 0)));
  newData.kartuKredit.forEach(k=> k.sisaBulan = Math.max(0,(Number(k.sisaBulan)||0)-1));
  // piutang & utang are an ongoing ledger — carry over as-is (nama, total, dibayar unchanged)
  newData.tabungan.forEach(t=>{
    t.total = (Number(t.total)||0) + (Number(t.debitKredit)||0); // roll last month's ending total forward
    t.debitKredit = 0;
  });
  newData.key = newKey;
  state.monthKeys.push(newKey);
  state.currentKey = newKey;
  state.data = newData;
  state.cache[newKey] = newData;
  await storeSet('month:'+newKey, newData);
  await storeSet('months:list', state.monthKeys);
  render();
}

async function deleteCurrentMonth(){
  if(state.monthKeys.length<=1){ showToast('Minimal harus ada 1 bulan'); return; }
  if(!confirm('Hapus data bulan '+fmtMonthLabel(state.currentKey)+'? Tindakan ini tidak bisa dibatalkan.')) return;
  clearTimeout(saveTimer); // don't let a pending debounced save recreate the month we're about to delete
  const key = state.currentKey;
  state.monthKeys = state.monthKeys.filter(k=>k!==key);
  delete state.cache[key];
  await storeSet('months:list', state.monthKeys);
  await storeDelete('month:'+key);
  state.currentKey = state.monthKeys[state.monthKeys.length-1];
  state.data = await loadMonth(state.currentKey);
  render();
}

/* ============================= EXPORT / IMPORT (manual sync, no cloud) ============================= */

async function exportAllData(){
  await persistCurrent();
  const months = {};
  for(const k of state.monthKeys){
    months[k] = state.cache[k] || await storeGet('month:'+k);
  }
  const payload = {
    app: 'anggaran-bulanan-keluarga',
    exportedAt: new Date().toISOString(),
    monthKeys: state.monthKeys,
    months,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'anggaran-keluarga-backup-'+stamp+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  showToast('Data diekspor');
}

function importDataFromFile(file){
  const reader = new FileReader();
  reader.onload = async ()=>{
    let payload;
    try{ payload = JSON.parse(reader.result); }
    catch(e){ showToast('File tidak valid'); return; }
    if(!payload || !payload.months || typeof payload.months !== 'object'){
      showToast('Format file tidak dikenali'); return;
    }
    const incomingKeys = Object.keys(payload.months);
    if(!incomingKeys.length){ showToast('Tidak ada data bulan di file ini'); return; }
    if(!confirm('Impor '+incomingKeys.length+' bulan dari file ini? Bulan dengan nama yang sama akan ditimpa.')) return;
    for(const k of incomingKeys){
      await storeSet('month:'+k, payload.months[k]);
      delete state.cache[k]; // force reload from storage for imported months
    }
    const merged = Array.from(new Set([...state.monthKeys, ...incomingKeys])).sort();
    state.monthKeys = merged;
    await storeSet('months:list', merged);
    state.currentKey = merged[merged.length-1];
    state.data = await loadMonth(state.currentKey);
    render();
    showToast('Impor berhasil');
  };
  reader.readAsText(file);
}

function bindNum(inputEl, getter, setter){
  inputEl.addEventListener('input', ()=>{
    const v = inputEl.value === '' ? 0 : Number(inputEl.value);
    setter(isNaN(v)?0:v);
    scheduleSave();
    renderSoft();
  });
}

}

      <thead><tr><th style="width:30%">Nama Wallet</th><th class="num">Saldo</th><th class="num">Efektif</th><th style="width:22%">Alokasi</th><th></th></tr></thead>
      <tbody id="ew-tbody"></tbody>
    </table>
    <button class="add-row-btn" id="add-ew">+ Tambah wallet</button>
    <div class="stat-row" style="margin-top:14px;"><div class="stat"><div class="label">Total Wallet/E-money</div><div class="value" id="ew-total"></div></div></div>
  </div>`);
  container.appendChild(ewCard);
  const ewTbody = ewCard.querySelector('#ew-tbody');
  function buildEwRow(w){
    const tr = el(`<tr>
      <td><input type="text" value="${escapeHtml(w.nama)}"></td>
      <td class="num"><input type="number" value="${w.saldo}"></td>
      <td class="num efektif-cell"></td>
      <td><select class="alokasi-select">${alokasiOptionsHtml(w.alokasi)}</select></td>
      <td><button class="row-del">✕</button></td>
    </tr>`);
    const [namaI,saldoI] = tr.querySelectorAll('input');
    const alokasiSel = tr.querySelector('.alokasi-select');
    bindText(namaI, v=>w.nama=v);
    bindNum(saldoI, ()=>w.saldo, v=>w.saldo=v);
    alokasiSel.addEventListener('change', ()=>{ w.alokasi = alokasiSel.value; scheduleSave(); paint(); });
    tr.querySelector('.row-del').addEventListener('click', ()=>{
      d.ewallets = d.ewallets.filter(x=>x.id!==w.id);
      scheduleSave(); rebuildEw();
    });
    tr._w = w; tr._efCell = tr.querySelector('.efektif-cell');
    return tr;
  }
  function rebuildEw(){
    ewTbody.innerHTML='';
    d.ewallets.forEach(w=> ewTbody.appendChild(buildEwRow(w)));
    paint();
  }
  ewCard.querySelector('#add-ew').addEventListener('click', ()=>{
    d.ewallets.push({id:uid(),nama:'',saldo:0,alokasi:''});
    scheduleSave(); rebuildEw();
  });

  // kesesuaian alokasi vs saldo
  const alokasiCheckCard = el(`<div class="card">
    <h2>Kesesuaian Alokasi & Saldo</h2>
    <p class="hint">Membandingkan sisa anggaran tiap pos (Prakiraan − Aktual) dengan uang yang benar-benar ada di rekening/wallet yang ditandai untuk pos itu. Selisih idealnya 0 — kalau tidak, berarti uangnya belum ada di rekening yang tepat, atau ada pengeluaran yang belum tercatat.</p>
    <table>
      <thead><tr><th>Pos Alokasi</th><th class="num">Sisa Anggaran</th><th class="num">Total Saldo Teralokasi</th><th class="num">Selisih</th></tr></thead>
      <tbody id="alokasi-check-tbody"></tbody>
    </table>
    <div class="stat-row" style="margin-top:14px;"><div class="stat"><div class="label">Saldo Belum Dialokasikan</div><div class="value" id="alokasi-unalloc"></div></div></div>
  </div>`);
  container.appendChild(alokasiCheckCard);
  const alokasiCheckTbody = alokasiCheckCard.querySelector('#alokasi-check-tbody');

  // transfer antar rekening
  function getAccounts(){ return accountsList(d); }
  function getAccountBalance(accId){ return accountBalanceRaw(d, accId); }
  function setAccountBalance(accId, val){ setAccountBalanceRaw(d, accId, val); }
  const topupCard = el(`<div class="card">
    <h2>Tambah / Kurangi Saldo</h2>
    <p class="hint">Untuk menambah saldo dari luar (mis. terima gaji, setor tunai) atau mengoreksi saldo tanpa perlu rekening asal. Isi jumlah positif untuk menambah, negatif untuk mengurangi.</p>
    <div class="grid3">
      <div class="field"><label>Rekening</label><select id="tu-acc"></select></div>
      <div class="field"><label>Jumlah</label><div class="num-input-wrap"><input type="number" id="tu-amount" placeholder="0"><button type="button" class="calc-trigger sign-toggle" id="tu-sign" title="Ubah tanda +/-">±</button></div></div>
      <div class="field" style="justify-content:flex-end;"><button class="btn btn-gold" id="tu-submit">Tambahkan</button></div>
    </div>
  </div>`);
  container.appendChild(topupCard);
  const tuAcc = topupCard.querySelector('#tu-acc');
  function fillTopupSelect(){
    const prevVal = tuAcc.value;
    const accs = getAccounts();
    tuAcc.innerHTML = accs.map(a=>`<option value="${a.id}">${escapeHtml(a.label)}</option>`).join('');
    if(accs.find(a=>a.id===prevVal)) tuAcc.value = prevVal;
  }
  fillTopupSelect();
  topupCard.querySelector('#tu-sign').addEventListener('click', ()=>{
    const inp = topupCard.querySelector('#tu-amount');
    inp.value = -(Number(inp.value)||0);
  });
  topupCard.querySelector('#tu-submit').addEventListener('click', ()=>{
    const accId = tuAcc.value;
    const amount = Number(topupCard.querySelector('#tu-amount').value)||0;
    if(!accId){ showToast('Pilih rekening'); return; }
    if(amount===0){ showToast('Isi jumlah terlebih dahulu'); return; }
    setAccountBalance(accId, getAccountBalance(accId)+amount);
    scheduleSave();
    showToast(amount>0?'Saldo ditambahkan':'Saldo dikurangi');
    render();
  });

  const transferCard = el(`<div class="card">
    <h2>Transfer Antar Rekening</h2>
    <p class="hint">Pindahkan saldo antar rekening, wallet, atau tabungan. Saldo di kedua sisi otomatis disesuaikan — cocok dipakai kalau ada tambahan dana dari tabungan untuk bulan ini.</p>
    <div class="grid3">
      <div class="field"><label>Dari</label><select id="tr-from"></select></div>
      <div class="field"><label>Ke</label><select id="tr-to"></select></div>
      <div class="field"><label>Jumlah</label><input type="number" id="tr-amount" placeholder="0"></div>
    </div>
    <button class="btn btn-gold" id="tr-submit" style="margin-top:12px;">Transfer</button>
  </div>`);
  container.appendChild(transferCard);
  const trFrom = transferCard.querySelector('#tr-from');
  const trTo = transferCard.querySelector('#tr-to');
  function fillAccountSelects(){
    const prevFrom = trFrom.value, prevTo = trTo.value;
    const accs = getAccounts();
    const optsHtml = accs.map(a=>`<option value="${a.id}">${escapeHtml(a.label)}</option>`).join('');
    trFrom.innerHTML = optsHtml;
    trTo.innerHTML = optsHtml;
    if(accs.find(a=>a.id===prevFrom)) trFrom.value = prevFrom;
    if(accs.find(a=>a.id===prevTo)) trTo.value = prevTo;
    else if(accs.length>1) trTo.selectedIndex = 1;
  }
  fillAccountSelects();
  transferCard.querySelector('#tr-submit').addEventListener('click', ()=>{
    const fromId = trFrom.value, toId = trTo.value;
    const amount = Number(transferCard.querySelector('#tr-amount').value)||0;
    if(!fromId||!toId||fromId===toId){ showToast('Pilih rekening asal dan tujuan yang berbeda'); return; }
    if(amount<=0){ showToast('Isi jumlah transfer'); return; }
    setAccountBalance(fromId, getAccountBalance(fromId)-amount);
    setAccountBalance(toId, getAccountBalance(toId)+amount);
    scheduleSave();
    showToast('Transfer berhasil');
    render();
  });

  // Now that every card (including the topup/transfer dropdowns) exists,
  // populate the row-based tables. Their rebuild functions call paint(),
  // which needs those dropdowns to already be in the DOM.
  rebuildSaldo();
  rebuildEw();

  function paint(){
    const c = computeAll(d);
    fillTopupSelect();
    fillAccountSelects();    const sr = container.querySelector('#stat-row');
    sr.innerHTML = `
      <div class="stat"><div class="label">Total Pendapatan</div><div class="value">${fmtIDR(c.totalPendapatan)}</div></div>
      <div class="stat"><div class="label">Total Alokasi</div><div class="value">${fmtIDR(c.totalAlokasi)}</div></div>
      <div class="stat"><div class="label">Total Aktual</div><div class="value">${fmtIDR(c.totalAktualBiaya)}</div></div>
      <div class="stat"><div class="label">Selisih Akhir</div><div class="value ${c.selisihAkhir<0?'bad':'good'}">${fmtIDR(c.selisihAkhir)}</div></div>
    `;
    const envWrap = container.querySelector('#envelopes');
    envWrap.innerHTML='';
    ['needs','wants','savings'].forEach(k=>{
      const g = d.groups[k]; const gc = c.g[k];
      const target = c.totalAlokasi * g.pct;
      const pctUsed = gc.prakiraan>0 ? Math.min(100, (gc.aktual/gc.prakiraan)*100) : 0;
      const over = gc.aktual > gc.prakiraan && gc.prakiraan>0;
      const card = el(`<div class="envelope" style="--env-color:${g.color}">
        <div class="env-label">${g.label}</div>
        <div class="env-pct">Target ${(g.pct*100).toFixed(0)}% · ${fmtIDR(target)}</div>
        <div class="env-bar"><div class="env-fill" style="width:${pctUsed}%"></div></div>
        <div class="env-nums">
          <span><span class="label">Prakiraan</span><br>${fmtIDR(gc.prakiraan)}</span>
          <span style="text-align:right"><span class="label">Aktual</span><br><b class="${over?'env-over':''}">${fmtIDR(gc.aktual)}</b></span>
        </div>
      </div>`);
      envWrap.appendChild(card);
    });
    const str = container.querySelector('#saldo-total-row');
    str.innerHTML = `
      <div class="stat"><div class="label">Total Rekening</div><div class="value">${fmtIDR(c.totalRekening)}</div></div>
      <div class="stat"><div class="label">Total Aset</div><div class="value">${fmtIDR(c.totalAset)}</div></div>
      <div class="stat"><div class="label">Tagihan Kartu Kredit</div><div class="value">${fmtIDR(c.kkTagihan)}</div></div>
      <div class="stat"><div class="label">Total Tabungan</div><div class="value">${fmtIDR(c.tabunganTotal)}</div></div>
    `;
    const ewTotalEl = container.querySelector('#ew-total');
    if(ewTotalEl) ewTotalEl.textContent = fmtIDR(c.totalEwallet);
    saldoTbody.querySelectorAll('tr').forEach(tr=>{
      if(!tr._a || !tr._efCell) return;
      tr._efCell.textContent = fmtIDR(accountEffectiveBalance(d, 'rek:'+tr._a.id));
    });
    ewTbody.querySelectorAll('tr').forEach(tr=>{
      if(!tr._w || !tr._efCell) return;
      tr._efCell.textContent = fmtIDR(accountEffectiveBalance(d, 'ew:'+tr._w.id));
    });
    const ac = computeAlokasiCheck(d);
    alokasiCheckTbody.innerHTML = Object.keys(ALOKASI_LABELS).map(k=>{
      const row = ac[k];
      const cls = row.selisih===0 ? 'selisih-pos' : 'selisih-neg';
      return `<tr>
        <td>${ALOKASI_LABELS[k]}</td>
        <td class="num">${fmtIDR(row.sisaAnggaran)}</td>
        <td class="num">${fmtIDR(row.totalSaldo)}</td>
        <td class="num ${cls}">${fmtIDR(row.selisih)}</td>
      </tr>`;
    }).join('');
    alokasiCheckCard.querySelector('#alokasi-unalloc').textContent = fmtIDR(ac.unallocated);
  }
  paint();
  return paint;
}

/* ============================= TAB: EXPENSE GROUP (generic) ============================= */
function renderExpenseGroup(container, groupKey){
  const d = state.data;
  const g = d.groups[groupKey];
  container.innerHTML='';

  const banner = el(`<div class="group-total-banner"><div class="gt-item"><span class="l">PRAKIRAAN</span><b id="gb-p"></b></div><div class="gt-item"><span class="l">AKTUAL</span><b id="gb-a"></b></div><div class="gt-item"><span class="l">SELISIH</span><b id="gb-s"></b></div><div class="gt-item"><span class="l">TARGET (% alokasi)</span><b id="gb-t"></b></div></div>`);
  container.appendChild(banner);

  const toolbar = el(`<div class="section-toolbar"><button class="btn-outline" id="add-subcat">+ Tambah Sub-kategori</button></div>`);
  container.appendChild(toolbar);
  toolbar.querySelector('#add-subcat').addEventListener('click', ()=>{
    g.subcats.push(subcat('Sub-kategori Baru',[item('Item baru')]));
    scheduleSave();
    fullRerenderTab();
  });

  const listWrap = el(`<div id="subcat-list"></div>`);
  container.appendChild(listWrap);

  function buildSubcatBlock(sc){
    const block = el(`<div class="card subcat-block">
      <div class="subcat-head">
        <input class="subcat-name" type="text" value="${escapeHtml(sc.name)}">
        <button class="row-del" title="Hapus sub-kategori">✕</button>
      </div>
      <table>
        <thead><tr><th style="width:40%">Item</th><th class="num">Prakiraan</th><th class="num">Aktual</th><th class="num">Selisih</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <button class="add-row-btn add-item-btn">+ Tambah item</button>
    </div>`);
    const nameInp = block.querySelector('.subcat-name');
    bindText(nameInp, v=>sc.name=v);
    block.querySelector('.row-del').addEventListener('click', ()=>{
      if(!confirm('Hapus sub-kategori "'+sc.name+'"?')) return;
      g.subcats = g.subcats.filter(x=>x.id!==sc.id);
      scheduleSave(); fullRerenderTab();
    });
    const tbody = block.querySelector('tbody');
    sc.items.forEach(it=>{
      const tr = el(`<tr>
        <td><input type="text" value="${escapeHtml(it.name)}"></td>
        <td class="num"><div class="num-input-wrap"><input type="number" value="${it.prakiraan}"><button type="button" class="calc-trigger" title="Kalkulator">🧮</button></div></td>
        <td class="num"><div class="num-input-wrap"><input type="number" value="${it.aktual}"><button type="button" class="calc-trigger" title="Kalkulator">🧮</button></div></td>
        <td class="num selisih-cell"></td>
        <td><button class="row-del">✕</button></td>
      </tr>`);
      const [nameI,prakI,aktI] = tr.querySelectorAll('input');
      const [prakCalcBtn,aktCalcBtn] = tr.querySelectorAll('.calc-trigger');
      bindText(nameI, v=>it.name=v);
      bindNum(prakI, ()=>it.prakiraan, v=>{it.prakiraan=v;}, );
      bindNum(aktI, ()=>it.aktual, v=>{it.aktual=v;});
      prakCalcBtn.addEventListener('click', ()=> openCalculator(prakCalcBtn, prakI));
      aktCalcBtn.addEventListener('click', ()=> openCalculator(aktCalcBtn, aktI));
      tr.querySelector('.row-del').addEventListener('click', ()=>{
        sc.items = sc.items.filter(x=>x.id!==it.id);
        scheduleSave(); fullRerenderTab();
      });
      tbody.appendChild(tr);
      tr._it = it; tr._selCell = tr.querySelector('.selisih-cell');
    });
    block.querySelector('.add-item-btn').addEventListener('click', ()=>{
      sc.items.push(item('Item baru'));
      scheduleSave(); fullRerenderTab();
    });
    // subtotal row
    const subtotalRow = el(`<tr class="subtotal"><td>Subtotal</td><td class="num" id="st-p"></td><td class="num" id="st-a"></td><td class="num" id="st-s"></td><td></td></tr>`);
    block.querySelector('tbody').appendChild(subtotalRow);
    block._subtotalRow = subtotalRow;
    return block;
  }

  function fullRerenderTab(){
    listWrap.innerHTML='';
    if(g.subcats.length===0){
      listWrap.appendChild(el(`<div class="empty-hint">Belum ada sub-kategori. Klik "+ Tambah Sub-kategori" untuk mulai.</div>`));
    }
    g.subcats.forEach(sc=> listWrap.appendChild(buildSubcatBlock(sc)));
    paint();
  }

  function paint(){
    listWrap.querySelectorAll('.subcat-block').forEach((block,idx)=>{
      const sc = g.subcats[idx];
      if(!sc) return;
      const c = computeSubcat(sc);
      const rows = block.querySelectorAll('tbody tr');
      rows.forEach(tr=>{
        if(!tr._it) return;
        const s = (Number(tr._it.prakiraan)||0)-(Number(tr._it.aktual)||0);
        tr._selCell.textContent = fmtIDR(s);
        tr._selCell.className = 'num selisih-cell '+(s<0?'selisih-neg':'selisih-pos');
      });
      block._subtotalRow.querySelector('#st-p') ? null : null;
      const stP = block.querySelector('[id="st-p"]'); const stA = block.querySelector('[id="st-a"]'); const stS = block.querySelector('[id="st-s"]');
      stP.textContent = fmtIDR(c.prakiraan); stA.textContent = fmtIDR(c.aktual);
      stS.textContent = fmtIDR(c.selisih); stS.className = 'num '+(c.selisih<0?'selisih-neg':'selisih-pos');
    });
    const gc = computeGroup(g);
    const totalAlokasi = computeAll(d).totalAlokasi;
    banner.querySelector('#gb-p').textContent = fmtIDR(gc.prakiraan);
    banner.querySelector('#gb-a').textContent = fmtIDR(gc.aktual);
    banner.querySelector('#gb-s').textContent = fmtIDR(gc.selisih);
    banner.querySelector('#gb-t').textContent = g.pct>0 ? (g.pct*100).toFixed(0)+'% · '+fmtIDR(totalAlokasi*g.pct) : '— (di luar alokasi 60/20/20)';
  }

  fullRerenderTab();
  return paint;
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================= TAB: KARTU KREDIT ============================= */
function renderKartuKredit(container){
  const d = state.data;
  container.innerHTML='';
  const card = el(`<div class="card">
    <h2>Cicilan Kartu Kredit</h2>
    <p class="hint">Catat setiap barang yang dicicil. Cicilan per bulan dihitung otomatis dari total harga dibagi tenor.</p>
    <table>
      <thead><tr><th style="width:32%">Nama Barang</th><th class="num">Total Harga</th><th class="num">Tenor (bulan)</th><th class="num">Sisa Bulan</th><th class="num">Cicilan/Bulan</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <button class="add-row-btn" id="add-kk">+ Tambah cicilan</button>
    <div class="stat-row" style="margin-top:14px;">
      <div class="stat"><div class="label">Total Tagihan Bulan Ini</div><div class="value" id="kk-total"></div></div>
    </div>
  </div>`);
  container.appendChild(card);
  const tbody = card.querySelector('tbody');

  function buildRow(k){
    const tr = el(`<tr>
      <td><input type="text" value="${escapeHtml(k.nama)}"></td>
      <td class="num"><input type="number" value="${k.totalHarga}"></td>
      <td class="num"><input type="number" value="${k.tenor}"></td>
      <td class="num"><input type="number" value="${k.sisaBulan}"></td>
      <td class="num cicilan-cell"></td>
      <td><button class="row-del">✕</button></td>
    </tr>`);
    const [namaI,hargaI,tenorI,sisaI] = tr.querySelectorAll('input');
    bindText(namaI, v=>k.nama=v);
    bindNum(hargaI, ()=>k.totalHarga, v=>k.totalHarga=v);
    bindNum(tenorI, ()=>k.tenor, v=>k.tenor=Math.max(1,v));
    bindNum(sisaI, ()=>k.sisaBulan, v=>k.sisaBulan=v);
    tr.querySelector('.row-del').addEventListener('click', ()=>{
      d.kartuKredit = d.kartuKredit.filter(x=>x.id!==k.id);
      scheduleSave(); rebuild();
    });
    tr._k = k; tr._cicilanCell = tr.querySelector('.cicilan-cell');
    return tr;
  }
  function rebuild(){
    tbody.innerHTML='';
    d.kartuKredit.forEach(k=> tbody.appendChild(buildRow(k)));
    paint();
  }
  card.querySelector('#add-kk').addEventListener('click', ()=>{
    d.kartuKredit.push({id:uid(),nama:'',totalHarga:0,tenor:1,sisaBulan:0});
    scheduleSave(); rebuild();
  });
  function paint(){
    let total=0;
    tbody.querySelectorAll('tr').forEach(tr=>{
      const k = tr._k;
      const cicilan = (Number(k.tenor)||0)>0 ? (Number(k.totalHarga)||0)/Number(k.tenor) : 0;
      tr._cicilanCell.textContent = fmtIDR(cicilan);
      if((Number(k.sisaBulan)||0)>0) total += cicilan;
    });
    card.querySelector('#kk-total').textContent = fmtIDR(total);
  }
  rebuild();
  return paint;
}

/* ============================= TAB: UTANG PIUTANG ============================= */
function renderUtangPiutang(container){
  const d = state.data;
  container.innerHTML='';

  function buildTable(listKey, title, hint){
    const card = el(`<div class="card">
      <h2>${title}</h2>
      <p class="hint">${hint}</p>
      <table>
        <thead><tr><th style="width:36%">Nama</th><th class="num">Total</th><th class="num">Dibayar</th><th class="num">Sisa</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <button class="add-row-btn">+ Tambah</button>
      <div class="stat-row" style="margin-top:14px;">
        <div class="stat"><div class="label">Total ${title}</div><div class="value tt-total"></div></div>
        <div class="stat"><div class="label">Total Dibayar</div><div class="value tt-dibayar"></div></div>
        <div class="stat"><div class="label">Total Sisa</div><div class="value tt-sisa"></div></div>
      </div>
    </div>`);
    container.appendChild(card);
    const tbody = card.querySelector('tbody');
    function buildRow(row){
      const tr = el(`<tr>
        <td><input type="text" value="${escapeHtml(row.nama)}"></td>
        <td class="num"><input type="number" value="${row.total}"></td>
        <td class="num"><input type="number" value="${row.dibayar}"></td>
        <td class="num sisa-cell"></td>
        <td><button class="row-del">✕</button></td>
      </tr>`);
      const [namaI,totalI,dibayarI] = tr.querySelectorAll('input');
      bindText(namaI, v=>row.nama=v);
      bindNum(totalI, ()=>row.total, v=>row.total=v);
      bindNum(dibayarI, ()=>row.dibayar, v=>row.dibayar=v);
      tr.querySelector('.row-del').addEventListener('click', ()=>{
        d[listKey] = d[listKey].filter(x=>x.id!==row.id);
        scheduleSave(); rebuild();
      });
      tr._row = row; tr._sisaCell = tr.querySelector('.sisa-cell');
      return tr;
    }
    function rebuild(){
      tbody.innerHTML='';
      d[listKey].forEach(row=> tbody.appendChild(buildRow(row)));
      paint();
    }
    card.querySelector('.add-row-btn').addEventListener('click', ()=>{
      d[listKey].push({id:uid(),nama:'',total:0,dibayar:0});
      scheduleSave(); rebuild();
    });
    function paint(){
      let t=0,db=0;
      tbody.querySelectorAll('tr').forEach(tr=>{
        const r = tr._row;
        const sisa = (Number(r.total)||0)-(Number(r.dibayar)||0);
        tr._sisaCell.textContent = fmtIDR(sisa);
        tr._sisaCell.className = 'num sisa-cell '+(sisa<0?'selisih-neg':'');
        t += Number(r.total)||0; db += Number(r.dibayar)||0;
      });
      card.querySelector('.tt-total').textContent = fmtIDR(t);
      card.querySelector('.tt-dibayar').textContent = fmtIDR(db);
      card.querySelector('.tt-sisa').textContent = fmtIDR(t-db);
    }
    rebuild();
    return paint;
  }

  const p1 = buildTable('piutang','Piutang','Uang yang dipinjamkan ke orang lain dan belum lunas dibayar.');
  const p2 = buildTable('utang','Utang','Utang kepada orang lain yang belum lunas dibayar.');
  return ()=>{ p1(); p2(); };
}

/* ============================= TAB: TABUNGAN ============================= */
function renderTabungan(container){
  const d = state.data;
  container.innerHTML='';
  const card = el(`<div class="card">
    <h2>Tabungan</h2>
    <p class="hint">Saldo tabungan per rekening. Debit/Kredit adalah perubahan bulan ini (isi positif untuk setoran, negatif untuk penarikan). "Efektif" sudah dikurangi pengeluaran aktual yang ditandai bersumber dari tabungan ini.</p>
    <table>
      <thead><tr><th style="width:30%">Rekening</th><th class="num">Total Tabungan</th><th class="num">Debit/Kredit</th><th class="num">Total Akhir</th><th class="num">Efektif</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <button class="add-row-btn">+ Tambah rekening</button>
    <div class="stat-row" style="margin-top:14px;">
      <div class="stat"><div class="label">Total Tabungan Keseluruhan</div><div class="value" id="tb-total"></div></div>
    </div>
  </div>`);
  container.appendChild(card);
  const tbody = card.querySelector('tbody');
  function buildRow(row){
    const tr = el(`<tr>
      <td><input type="text" value="${escapeHtml(row.rekening)}"></td>
      <td class="num"><input type="number" value="${row.total}"></td>
      <td class="num"><div class="num-input-wrap"><input type="number" value="${row.debitKredit}"><button type="button" class="calc-trigger sign-toggle" title="Ubah tanda +/-">±</button></div></td>
      <td class="num akhir-cell"></td>
      <td class="num efektif-cell"></td>
      <td><button class="row-del">✕</button></td>
    </tr>`);
    const [namaI,totalI,dkI] = tr.querySelectorAll('input');
    const signBtn = tr.querySelector('.sign-toggle');
    bindText(namaI, v=>row.rekening=v);
    bindNum(totalI, ()=>row.total, v=>row.total=v);
    bindNum(dkI, ()=>row.debitKredit, v=>row.debitKredit=v);
    signBtn.addEventListener('click', ()=>{
      dkI.value = -(Number(dkI.value)||0);
      dkI.dispatchEvent(new Event('input', {bubbles:true}));
    });
    tr.querySelector('.row-del').addEventListener('click', ()=>{
      d.tabungan = d.tabungan.filter(x=>x.id!==row.id);
      scheduleSave(); rebuild();
    });
    tr._row = row; tr._akhirCell = tr.querySelector('.akhir-cell'); tr._efCell = tr.querySelector('.efektif-cell');
    return tr;
  }
  function rebuild(){
    tbody.innerHTML='';
    d.tabungan.forEach(row=> tbody.appendChild(buildRow(row)));
    paint();
  }
  card.querySelector('.add-row-btn').addEventListener('click', ()=>{
    d.tabungan.push({id:uid(),rekening:'',total:0,debitKredit:0});
    scheduleSave(); rebuild();
  });
  function paint(){
    let total=0;
    tbody.querySelectorAll('tr').forEach(tr=>{
      const r = tr._row;
      const akhir = (Number(r.total)||0)+(Number(r.debitKredit)||0);
      tr._akhirCell.textContent = fmtIDR(akhir);
      tr._efCell.textContent = fmtIDR(accountEffectiveBalance(d, 'tab:'+r.id));
      total += akhir;
    });
    card.querySelector('#tb-total').textContent = fmtIDR(total);
  }
  rebuild();
  return paint;
}

/* ============================= MAIN RENDER ============================= */
const TABS = [
  {id:'ringkasan', label:'Ringkasan'},
  {id:'needs', label:'Kebutuhan Pokok'},
  {id:'wants', label:'Sekunder & Fleksibel'},
  {id:'savings', label:'Pinjaman & Tabungan'},
  {id:'kartukredit', label:'Kartu Kredit'},
  {id:'utangpiutang', label:'Utang & Piutang'},
  {id:'tabungan', label:'Tabungan'},
];

function render(){
  const root = document.getElementById('root');
  root.innerHTML='';
  if(!state.loaded){
    root.appendChild(el(`<div style="padding:40px;text-align:center;color:#5C6D68;">Memuat data…</div>`));
    return;
  }
  // HERO
  const hero = el(`<div class="hero"><div class="hero-inner">
    <div class="hero-top">
      <div class="brand">
        <div class="brand-mark">Rp</div>
        <div><div class="brand-name">Anggaran Bulanan Keluarga</div><div class="brand-sub">${fmtMonthLabel(state.currentKey)}</div></div>
      </div>
      <div class="month-controls">
        <select class="month-select" id="month-select"></select>
        <button class="btn btn-gold" id="btn-add-month">+ Bulan Baru</button>
        <button class="btn btn-danger-ghost" id="btn-del-month">Hapus</button>
      </div>
    </div>
    <div class="backup-row">
      <span class="storage-badge">${hasCloudStorage? '☁ Tersimpan di akun Claude' : '📱 Tersimpan di perangkat ini saja'}</span>
      <button class="btn btn-ghost" id="btn-export">⬇ Ekspor Data</button>
      <button class="btn btn-ghost" id="btn-import">⬆ Impor Data</button>
      <input type="file" id="import-file" accept="application/json" style="display:none;">
    </div>
    <div class="tabs" id="tabs"></div>
  </div></div>`);
  root.appendChild(hero);

  const select = hero.querySelector('#month-select');
  state.monthKeys.forEach(k=>{
    const opt = document.createElement('option');
    opt.value = k; opt.textContent = fmtMonthLabel(k);
    if(k===state.currentKey) opt.selected = true;
    select.appendChild(opt);
  });
  select.addEventListener('change', ()=> switchMonth(select.value));
  hero.querySelector('#btn-add-month').addEventListener('click', addNewMonth);
  hero.querySelector('#btn-del-month').addEventListener('click', deleteCurrentMonth);
  hero.querySelector('#btn-export').addEventListener('click', exportAllData);
  const importInput = hero.querySelector('#import-file');
  hero.querySelector('#btn-import').addEventListener('click', ()=> importInput.click());
  importInput.addEventListener('change', ()=>{
    if(importInput.files && importInput.files[0]) importDataFromFile(importInput.files[0]);
    importInput.value = '';
  });

  const tabsWrap = hero.querySelector('#tabs');
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'tab-btn'+(state.tab===t.id?' active':'');
    b.textContent = t.label;
    b.addEventListener('click', ()=>{ state.tab = t.id; render(); });
    tabsWrap.appendChild(b);
  });

  const wrap = el(`<div class="wrap"></div>`);
  root.appendChild(wrap);
  const content = el(`<div id="content"></div>`);
  wrap.appendChild(content);

  let paintFn = null;
  if(state.tab==='ringkasan') paintFn = renderRingkasan(content);
  else if(state.tab==='needs') paintFn = renderExpenseGroup(content,'needs');
  else if(state.tab==='wants') paintFn = renderExpenseGroup(content,'wants');
  else if(state.tab==='savings') paintFn = renderExpenseGroup(content,'savings');
  else if(state.tab==='kartukredit') paintFn = renderKartuKredit(content);
  else if(state.tab==='utangpiutang') paintFn = renderUtangPiutang(content);
  else if(state.tab==='tabungan') paintFn = renderTabungan(content);

  softRenderFn = paintFn;

  wrap.appendChild(el(`<footer class="note">Data tersimpan otomatis per bulan di perangkat ini.</footer>`));
}

init();
</script>
</body>
